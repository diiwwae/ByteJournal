version: "3.9"

services:
  db:
    image: postgres:15
    container_name: bitjournal_db
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: bitjournal_backend
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8001:8001"

  frontend:
    build: ./streamlit-app
    container_name: bitjournal_frontend
    depends_on:
      - backend
    environment:
      - API_BASE_URL=http://backend:8001
    ports:
      - "8501:8501"

volumes:
  pg_data:
